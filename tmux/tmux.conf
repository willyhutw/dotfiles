# plugins
set -g @plugin 'tmux-plugins/tpm#v3.1.0'
set -g @plugin 'tmux-plugins/tmux-sensible#v3.0.0'
set -g @plugin 'tmux-plugins/tmux-pain-control#v1.0.0'
set -g @plugin 'tmux-plugins/tmux-yank#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-resurrect#v4.0.0'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'sainnhe/tmux-fzf'

set-option -sa terminal-overrides ',xterm-256color:RGB'

# vi in copy mode
set-window-option -g mode-keys vi

# restore panel content & vim session
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-dir '~/.tmux/resurrect'

# split window on current working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# mouse support
set -g mouse on

# load theme
source-file ~/.config/tmux/themes/gruvbox_dark.tmux
#source-file ~/.config/tmux/themes/tokyonight_night.tmux

# prefix highlight
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'

# new tmux window in the same current working directory
bind-key c new-window -c '#{pane_current_path}'
bind-key '"' split-window -c '#{pane_current_path}'
bind-key % split-window -h -c '#{pane_current_path}'

# stay in copy mode after copying, so the view does not jump back to the bottom (press q to leave)
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind -T copy-mode-vi Enter             send-keys -X copy-pipe
bind -T copy-mode-vi DoubleClick1Pane  select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear
bind -T copy-mode-vi TripleClick1Pane  select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear

run '~/.tmux/plugins/tpm/tpm'

# tmux-yank v2.3.0 hardcodes y to copy-pipe-and-cancel (no @yank_action), so override it after tpm loads.
# No pipe command: the clipboard is set through set-clipboard (OSC 52), same as the mouse bindings.
bind -T copy-mode-vi y send-keys -X copy-pipe-no-clear
